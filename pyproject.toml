[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingai"
version = "1.0.0"
description = "Indicator-scored watchlist and rule backtester"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
tradingai = "tradingai.cli:main"

[tool.setuptools]
packages = ["tradingai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = "tests/.pytest_cache"
pythonpath = [".", "tests"]
